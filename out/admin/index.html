<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN V21</title>
<style>
body{font-family:system-ui;background:#111;color:#fff;padding:20px}
.stat{background:#222;padding:16px;border-radius:12px;margin:10px 0}
h1{color:#00ff88}
</style>
</head>
<body>
<h1>ADMIN V21 FINAL GREEN</h1>
<div id="stats">Loading...</div>
<script>
async function load(){
  try{
    const r=await fetch('/admin/data');
    const d=await r.json();
    document.getElementById('stats').innerHTML=
      `<div class="stat">Users: ${d.totalUsers}</div>
       <div class="stat">Revenue: KES ${d.totalRev}</div>
       <div class="stat">Clicks: ${d.totalClicks}</div>
       <div class="stat">Conversions: ${d.totalConv}</div>
       <pre>${JSON.stringify(d.tx.slice(-5),null,2)}</pre>`;
  }catch(e){
    document.getElementById('stats').innerHTML='Error: '+e;
  }
}
setInterval(load, 3000);
load();
</script>
</body>
</html>
